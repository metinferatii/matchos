<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live match centre</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="widget.css">
</head>
<body>
<main class="w" id="w" aria-live="off">
  <section class="card live">
    <h2 class="card-title">
      <span class="flag" id="homeFlag"></span>
      <span class="title-text"><span class="dot" id="liveDot"></span><span id="feedTitle">Live</span></span>
      <span class="flag" id="awayFlag"></span>
    </h2>
    <span class="sec-sub" id="feedSub" hidden></span>

    <div class="scoreline" id="bug">
      <div class="bug-row">
        <span class="tname home"><b id="homeName">Argentina</b><span id="homeCode" hidden>ARG</span></span>
        <span class="score" aria-label="score"><span class="n" id="homeScore">0</span><span class="dash">–</span><span class="n" id="awayScore">0</span></span>
        <span class="tname away"><b id="awayName">France</b><span id="awayCode" hidden>FRA</span></span>
      </div>
      <div class="clock"><span id="minute">–</span><span class="goalline" id="goalwipe" aria-live="polite"><b id="gwWord">Goal</b> <span id="gwWho"></span></span></div>
      <div class="pens" id="pens" hidden><span id="pensLabel">Penalties</span> <span class="pens-score"><b id="pensHome">0</b>–<b id="pensAway">0</b></span></div>
      <div class="conn" id="conn" hidden><span id="connText">Reconnecting…</span></div>
    </div>

    <div class="sheet-wrap" id="sheetWrap" hidden>
      <div class="sheet" id="sheet" role="region" aria-labelledby="offerTitle">
        <div class="sheet-top">
          <span class="flash-tag" id="flashTag">Flash offer</span>
          <span class="countdown"><span id="endsIn">Ends in</span> <b id="countdown">0:00</b></span>
        </div>
        <div class="sheet-main">
          <div class="jersey" id="jersey"></div>
          <div class="offer-info">
            <p class="offer-by" id="offerBy" hidden>Your agent got you this</p>
            <h3 id="offerTitle" dir="auto">Jersey</h3>
            <div class="price">
              <span class="now" id="priceNow">€0</span>
              <s class="was" id="priceWas">€0</s>
              <span class="off" id="priceOff" hidden>-0%</span>
              <span class="mini-count" id="miniCount"></span>
            </div>
          </div>
        </div>
        <div class="sheet-actions" id="sheetActions">
          <button class="buy" id="buyBtn" type="button">Buy now</button>
          <button class="later" id="laterBtn" type="button">Not now</button>
        </div>
        <p class="confirm" id="confirm" hidden></p>
        <div hidden><span id="timebar"></span></div>
      </div>
    </div>

    <ol class="feed" id="feed"></ol>

    <form class="ask" id="askForm" autocomplete="off">
      <input id="askInput" maxlength="300" placeholder="Ask anything about this match" aria-label="Ask the match">
      <button type="submit" id="askBtn">Ask</button>
    </form>
  </section>

  <section class="card predict" id="predict">
    <h2 class="card-title"><span id="predictTitle">Who scores next?</span></h2>
    <p class="hint"><span id="predictHint">Tap a player to make your call.</span> <span id="voteCount"></span></p>
    <div class="teams" id="voteTeams"></div>
  </section>

  <footer class="foot">
    <span id="poweredBy">Powered by <b>Matchday OS</b></span>
    <span>Data: StatsBomb Open Data</span>
  </footer>
</main>
<script src="widget.js"></script>
</body>
</html>
